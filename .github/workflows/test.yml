name: Testes e CI

# Spec: .kiro/specs/qualidade-e-testes (Requisito 4)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  # Chaves do projeto Supabase de testes, cadastradas em Settings > Secrets and variables > Actions.
  # Sem os secrets, o build usa valores de exemplo (o app nao acessa o Supabase no build).
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://exemplo.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'chave-de-exemplo' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_APP_URL: http://localhost:3000

defaults:
  run:
    working-directory: src/app-MusicOS

jobs:
  unit:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/app-MusicOS/package-lock.json
      - run: npm ci
      - run: npx vitest run

  lint:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/app-MusicOS/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json

  e2e:
    name: Build e testes E2E
    runs-on: ubuntu-latest
    needs: [unit, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/app-MusicOS/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/app-MusicOS/playwright-report
            src/app-MusicOS/test-results
          retention-days: 7

  # Deploy desligado ate existir a spec de publicacao (Vercel).
