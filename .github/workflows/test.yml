name: Tests & CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # TESTES UNITÁRIOS
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/app-MusicOS/package-lock.json

      - name: Install dependencies
        working-directory: src/app-MusicOS
        run: npm ci

      - name: Run Unit Tests
        working-directory: src/app-MusicOS
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: src/app-MusicOS/coverage
          flags: unit
          name: Unit Tests Coverage

  # ============================================
  # LINT
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/app-MusicOS/package-lock.json

      - name: Install dependencies
        working-directory: src/app-MusicOS
        run: npm ci

      - name: Run Lint
        working-directory: src/app-MusicOS
        run: npm run lint

  # ============================================
  # BUILD
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/app-MusicOS/package-lock.json

      - name: Install dependencies
        working-directory: src/app-MusicOS
        run: npm ci

      - name: Build Application
        working-directory: src/app-MusicOS
        run: npm run build

  # ============================================
  # TESTES E2E
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/app-MusicOS/package-lock.json

      - name: Install dependencies
        working-directory: src/app-MusicOS
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/app-MusicOS
        run: npx playwright install --with-deps

      - name: Start development server
        working-directory: src/app-MusicOS
        run: npm run dev &
        shell: bash

      - name: Wait for server
        run: sleep 10 && curl -f http://localhost:3000

      - name: Run E2E Tests
        working-directory: src/app-MusicOS
        run: npm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/app-MusicOS/test-results

  # ============================================
  # DEPLOY (apenas em main)
  # ============================================
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, e2e-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'